<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Link - Discover</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { margin:0; font-family:-apple-system,sans-serif; background:#fff0f4; min-height:100vh; padding:20px; box-sizing:border-box; }
  .topBar { display:flex; justify-content:space-between; align-items:center; max-width:400px; margin:0 auto 10px auto; gap:8px; flex-wrap:wrap; }
  h2 { color:#ff5f8a; margin:0; }
  .topLinks { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .topLinks a { color:#ff5f8a; font-weight:bold; text-decoration:none; font-size:13px; background:white; padding:8px 12px; border-radius:16px; box-shadow:0 2px 6px rgba(0,0,0,0.06); white-space:nowrap; }
  .grid { display:flex; flex-direction:column; gap:16px; max-width:400px; margin:0 auto; }
  .profile-card { background:white; border-radius:16px; padding:16px; box-shadow:0 6px 20px rgba(0,0,0,0.08); position:relative; }
  .profile-card.vip-gold { border:2px solid #ffd700; }
  .profile-card.vip-silver { border:2px solid #c0c0c0; }
  .profile-card.vip-bronze { border:2px solid #cd7f32; }
  .cardTop { display:flex; gap:12px; align-items:center; }
  .photoWrap { position:relative; flex-shrink:0; }
  .photoWrap img { width:70px; height:70px; border-radius:50%; object-fit:cover; background:#eee; display:block; }
  .onlineDot { position:absolute; bottom:2px; right:2px; width:14px; height:14px; border-radius:50%; background:#ccc; border:2px solid white; }
  .onlineDot.online { background:#2ecc71; }
  .profile-info { flex:1; }
  .profile-info h3 { margin:0 0 4px 0; color:#333; font-size:17px; display:flex; align-items:center; gap:6px; }
  .profile-info p { margin:0; color:#777; font-size:13px; }
  .vipBadge { font-size:11px; padding:2px 8px; border-radius:10px; font-weight:bold; color:white; }
  .badge-gold { background:#d4af00; }
  .badge-silver { background:#999; }
  .badge-bronze { background:#a15c2e; }
  .like-btn { background:#ff5f8a; color:white; border:none; border-radius:50%; width:44px; height:44px; font-size:20px; flex-shrink:0; }
  .cardActions { display:flex; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid #f0f0f0; }
  .cardActions button { background:none; border:none; color:#999; font-size:12px; font-weight:bold; }
  .cardActions .blockBtn { color:#e74c3c; }
  .msg { text-align:center; margin-top:20px; color:#999; }
  .match-popup { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:99; }
  .match-box { background:white; border-radius:20px; padding:32px 24px; text-align:center; max-width:300px; }
  .match-box h1 { color:#ff5f8a; margin-top:0; }
  .match-box .chatBtn { display:block; margin-top:16px; padding:12px 24px; background:#ff5f8a; color:white; border:none; border-radius:8px; font-weight:bold; text-decoration:none; }
  .match-box .laterBtn { display:block; margin-top:10px; padding:10px 24px; background:#eee; color:#555; border:none; border-radius:8px; font-weight:bold; width:100%; box-sizing:border-box; }
  .reportOverlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:99; padding:20px; }
  .reportBox { background:white; border-radius:16px; padding:20px; max-width:320px; width:100%; }
  .reportBox h3 { margin-top:0; color:#333; }
  .reportBox textarea { width:100%; border:1px solid #ddd; border-radius:8px; padding:10px; box-sizing:border-box; font-family:inherit; min-height:80px; }
  .reportBox button { width:100%; padding:10px; border:none; border-radius:8px; font-weight:bold; margin-top:8px; }
  .reportBox .submitReportBtn { background:#ff5f8a; color:white; }
  .reportBox .cancelReportBtn { background:#eee; color:#555; }
</style>
</head>
<body>
<div class="topBar">
  <h2>Discover</h2>
  <div class="topLinks">
    <a href="community.html">🌐 Community</a>
    <a href="profile.html">👤 Profile</a>
    <a href="vip.html">💎 VIP</a>
    <a href="chat.html">💬 Matches</a>
    <a href="withdraw.html">💰 Earnings</a>
  </div>
</div>
<div class="grid" id="grid"></div>
<div class="msg" id="msg">Loading profiles...</div>

<div class="match-popup" id="matchPopup">
  <div class="match-box">
    <h1>💗 It's a Match!</h1>
    <p>You and this person liked each other.</p>
    <a class="chatBtn" id="startChatBtn" href="#">Start Chatting</a>
    <button class="laterBtn" onclick="document.getElementById('matchPopup').style.display='none'">Maybe Later</button>
  </div>
</div>

<div class="reportOverlay" id="reportOverlay">
  <div class="reportBox">
    <h3>Report this user</h3>
    <textarea id="reportReason" placeholder="What's the issue?"></textarea>
    <button class="submitReportBtn" id="submitReportBtn">Submit Report</button>
    <button class="cancelReportBtn" id="cancelReportBtn">Cancel</button>
  </div>
</div>

<script>
  var supabaseUrl = 'https://hqwqodmrnplswieprhms.supabase.co';
  var supabaseKey = 'sb_publishable_Wza9AqCngRXI-6GjMO6r2g_yNBJx6rY';
  var supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
  var grid = document.getElementById('grid');
  var msg = document.getElementById('msg');
  var startChatBtn = document.getElementById('startChatBtn');
  var reportOverlay = document.getElementById('reportOverlay');
  var reportReason = document.getElementById('reportReason');
  var submitReportBtn = document.getElementById('submitReportBtn');
  var cancelReportBtn = document.getElementById('cancelReportBtn');

  var currentUserId = null;
  var reportTargetId = null;

  function vipInfo(tierName) {
    if (!tierName) return null;
    var lower = tierName.toLowerCase();
    if (lower.indexOf('gold') !== -1) return { cardClass: 'vip-gold', badgeClass: 'badge-gold' };
    if (lower.indexOf('silver') !== -1) return { cardClass: 'vip-silver', badgeClass: 'badge-silver' };
    if (lower.indexOf('bronze') !== -1) return { cardClass: 'vip-bronze', badgeClass: 'badge-bronze' };
    return { cardClass: '', badgeClass: 'badge-bronze' };
  }

  function isOnline(lastSeen) {
    if (!lastSeen) return false;
    var diffMs = new Date() - new Date(lastSeen);
    return diffMs < 5 * 60 * 1000; // online if active in last 5 minutes
  }

  function startHeartbeat() {
    function beat() {
      supabaseClient.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', currentUserId).then(function() {});
    }
    beat();
    setInterval(beat, 60000);
  }

  cancelReportBtn.addEventListener('click', function() {
    reportOverlay.style.display = 'none';
    reportReason.value = '';
    reportTargetId = null;
  });

  submitReportBtn.addEventListener('click', async function() {
    var reason = reportReason.value.trim();
    if (!reason || !reportTargetId) return;

    submitReportBtn.disabled = true;
    submitReportBtn.textContent = 'Submitting...';

    var result = await supabaseClient.from('reports').insert({
      reporter_id: currentUserId,
      reported_id: reportTargetId,
      reason: reason
    });

    submitReportBtn.disabled = false;
    submitReportBtn.textContent = 'Submit Report';

    if (result.error) {
      alert('Failed: ' + result.error.message);
      return;
    }

    alert('Report submitted. Thank you.');
    reportOverlay.style.display = 'none';
    reportReason.value = '';
    reportTargetId = null;
  });

  async function loadProfiles() {
    var userRes = await supabaseClient.auth.getUser();
    var user = userRes.data.user;
    if (!user) {
      msg.textContent = 'Please log in first.';
      return;
    }
    currentUserId = user.id;
    startHeartbeat();

    var profilesRes = await supabaseClient.from('profiles').select('*');
    if (profilesRes.error) {
      msg.textContent = 'Error: ' + profilesRes.error.message;
      return;
    }

    var blocksRes = await supabaseClient
      .from('blocks')
      .select('blocked_id')
      .eq('blocker_id', currentUserId);
    var blockedByMeSet = {};
    if (blocksRes.data) {
      blocksRes.data.forEach(function(b) { blockedByMeSet[b.blocked_id] = true; });
    }

    var blockedMeRes = await supabaseClient
      .from('blocks')
      .select('blocker_id')
      .eq('blocked_id', currentUserId);
    var blockedMeSet = {};
    if (blockedMeRes.data) {
      blockedMeRes.data.forEach(function(b) { blockedMeSet[b.blocker_id] = true; });
    }

    var tiersRes = await supabaseClient.from('vip_tiers').select('id, name');
    var tierMap = {};
    if (tiersRes.data) {
      tiersRes.data.forEach(function(t) { tierMap[t.id] = t.name; });
    }

    var others = profilesRes.data.filter(function(p) {
      return p.id !== currentUserId && !blockedByMeSet[p.id] && !blockedMeSet[p.id];
    });

    if (others.length === 0) {
      msg.textContent = 'No other profiles yet. Check back soon!';
      return;
    }

    var now = new Date();
    others.forEach(function(p) {
      p._isVip = p.vip_tier_id && p.vip_expires_at && new Date(p.vip_expires_at) > now;
      p._tierName = p._isVip ? tierMap[p.vip_tier_id] : null;
    });

    others.sort(function(a, b) {
      return (b._isVip ? 1 : 0) - (a._isVip ? 1 : 0);
    });

    msg.textContent = '';
    others.forEach(function(p) {
      var vip = p._isVip ? vipInfo(p._tierName) : null;
      var online = isOnline(p.last_seen);

      var card = document.createElement('div');
      card.className = 'profile-card' + (vip ? ' ' + vip.cardClass : '');

      var cardTop = document.createElement('div');
      cardTop.className = 'cardTop';

      var photoWrap = document.createElement('div');
      photoWrap.className = 'photoWrap';
      var img = document.createElement('img');
      img.src = p.photo_url || 'https://via.placeholder.com/70?text=%F0%9F%92%97';
      var dot = document.createElement('div');
      dot.className = 'onlineDot' + (online ? ' online' : '');
      photoWrap.appendChild(img);
      photoWrap.appendChild(dot);

      var info = document.createElement('div');
      info.className = 'profile-info';
      var name = document.createElement('h3');
      name.textContent = (p.full_name || 'Someone') + (p.age ? ', ' + p.age : '');
      if (vip) {
        var badge = document.createElement('span');
        badge.className = 'vipBadge ' + vip.badgeClass;
        badge.textContent = p._tierName;
        name.appendChild(badge);
      }
      var bio = document.createElement('p');
      bio.textContent = p.bio || '';
      info.appendChild(name);
      info.appendChild(bio);

      var likeBtn = document.createElement('button');
      likeBtn.className = 'like-btn';
      likeBtn.textContent = '💗';
      likeBtn.addEventListener('click', async function() {
        likeBtn.disabled = true;

        var insertRes = await supabaseClient.from('likes').insert({ liker_id: currentUserId, liked_id: p.id });
        if (insertRes.error) {
          likeBtn.textContent = '❌';
          return;
        }
        likeBtn.textContent = '✅';

        var mutualRes = await supabaseClient.from('likes').select('*').eq('liker_id', p.id).eq('liked_id', currentUserId);
        if (mutualRes.data && mutualRes.data.length > 0) {
          var existingMatch = await supabaseClient
            .from('matches')
            .select('id')
            .or('and(user1_id.eq.' + currentUserId + ',user2_id.eq.' + p.id + '),and(user1_id.eq.' + p.id + ',user2_id.eq.' + currentUserId + ')')
            .maybeSingle();

          var matchId = null;
          if (existingMatch.data) {
            matchId = existingMatch.data.id;
          } else {
            var matchRes = await supabaseClient
              .from('matches')
              .insert({ user1_id: currentUserId, user2_id: p.id })
              .select()
              .single();
            if (matchRes.data) matchId = matchRes.data.id;
          }

          startChatBtn.href = matchId ? 'chat.html?match=' + matchId : 'chat.html';
          document.getElementById('matchPopup').style.display = 'flex';
        }
      });

      cardTop.appendChild(photoWrap);
      cardTop.appendChild(info);
      cardTop.appendChild(likeBtn);

      var actions = document.createElement('div');
      actions.className = 'cardActions';

      var reportBtn = document.createElement('button');
      reportBtn.textContent = '🚩 Report';
      reportBtn.addEventListener('click', function() {
        reportTargetId = p.id;
        reportOverlay.style.display = 'flex';
      });

      var blockBtn = document.createElement('button');
      blockBtn.className = 'blockBtn';
      blockBtn.textContent = '🚫 Block';
      blockBtn.addEventListener('click', async function() {
        if (!confirm('Block this user? They will no longer appear in Discover.')) return;
        var result = await supabaseClient.from('blocks').insert({ blocker_id: currentUserId, blocked_id: p.id });
        if (result.error) {
          alert('Failed: ' + result.error.message);
          return;
        }
        card.remove();
      });

      actions.appendChild(reportBtn);
      actions.appendChild(blockBtn);

      card.appendChild(cardTop);
      card.appendChild(actions);
      grid.appendChild(card);
    });
  }

  loadProfiles();
</script>
</body>
</html>
