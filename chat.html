<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Link - Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { margin:0; font-family:-apple-system,sans-serif; background:#fff0f4; height:100vh; display:flex; flex-direction:column; }
  .header { background:#ff5f8a; color:white; padding:16px; text-align:center; font-weight:bold; }
  .messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .bubble { max-width:75%; padding:10px 14px; border-radius:16px; font-size:14px; }
  .mine { align-self:flex-end; background:#ff5f8a; color:white; }
  .theirs { align-self:flex-start; background:white; color:#333; box-shadow:0 2px 6px rgba(0,0,0,0.08); }
  .inputRow { display:flex; padding:12px; gap:8px; background:white; }
  .inputRow input { flex:1; padding:12px; border:1px solid #ddd; border-radius:20px; }
  .inputRow button { background:#ff5f8a; color:white; border:none; border-radius:20px; padding:0 20px; font-weight:bold; }
  .msg { text-align:center; color:#999; padding:20px; }
</style>
</head>
<body>
<div class="header">Chat</div>
<div class="messages" id="messages"><div class="msg" id="loadingMsg">Loading conversation list...</div></div>
<div class="inputRow" style="display:none;" id="inputRow">
  <input type="text" id="msgInput" placeholder="Type a message...">
  <button id="sendBtn">Send</button>
</div>

<script>
  var supabaseUrl = 'https://hqwqodmrnplswieprhms.supabase.co';
  var supabaseKey = 'sb_publishable_Wza9AqCngRXI-6GjMO6r2g_yNBJx6rY';
  var supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
  var messagesDiv = document.getElementById('messages');
  var inputRow = document.getElementById('inputRow');
  var msgInput = document.getElementById('msgInput');
  var sendBtn = document.getElementById('sendBtn');
  var currentUserId = null;
  var activeMatchId = null;

  function getMatchIdFromUrl() {
    var params = new URLSearchParams(window.location.search);
    return params.get('match');
  }

  async function init() {
    var userRes = await supabaseClient.auth.getUser();
    var user = userRes.data.user;
    if (!user) {
      messagesDiv.innerHTML = '<div class="msg">Please log in first.</div>';
      return;
    }
    currentUserId = user.id;

    var matchId = getMatchIdFromUrl();
    if (!matchId) {
      var matchesRes = await supabaseClient.from('matches').select('*');
      if (!matchesRes.data || matchesRes.data.length === 0) {
        messagesDiv.innerHTML = '<div class="msg">No matches yet. Go like someone on Discover first!</div>';
        return;
      }
      var links = matchesRes.data.map(function(m) {
        var otherId = m.user1_id === currentUserId ? m.user2_id : m.user1_id;
        return '<div class="msg"><a href="chat.html?match=' + m.id + '">Open chat with match ' + otherId.slice(0,8) + '</a></div>';
      }).join('');
      messagesDiv.innerHTML = links;
      return;
    }

    activeMatchId = matchId;
    inputRow.style.display = 'flex';
    loadMessages();
  }

  async function loadMessages() {
    messagesDiv.innerHTML = '';
    var res = await supabaseClient.from('messages').select('*').eq('match_id', activeMatchId).order('created_at', { ascending: true });
    if (res.error) {
      messagesDiv.innerHTML = '<div class="msg">Error: ' + res.error.message + '</div>';
      return;
    }
    res.data.forEach(function(m) {
      var bubble = document.createElement('div');
      bubble.className = 'bubble ' + (m.sender_id === currentUserId ? 'mine' : 'theirs');
      bubble.textContent = m.content;
      messagesDiv.appendChild(bubble);
    });
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  sendBtn.addEventListener('click', async function() {
    var text = msgInput.value.trim();
    if (!text || !activeMatchId) return;
    msgInput.value = '';
    await supabaseClient.from('messages').insert({ match_id: activeMatchId, sender_id: currentUserId, content: text });
    loadMessages();
  });

  msgInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendBtn.click();
  });

  init();
</script>
</body>
</html>
