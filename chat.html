<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Link - Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { margin:0; font-family:-apple-system,sans-serif; background:#fff0f4; height:100vh; display:flex; flex-direction:column; }
  .header { background:#ff5f8a; color:white; padding:16px; text-align:center; font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
  .coinBadge { background:rgba(255,255,255,0.25); padding:4px 10px; border-radius:12px; font-size:13px; }
  .messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .bubble { max-width:75%; padding:10px 14px; border-radius:16px; font-size:14px; }
  .mine { align-self:flex-end; background:#ff5f8a; color:white; }
  .theirs { align-self:flex-start; background:white; color:#333; box-shadow:0 2px 6px rgba(0,0,0,0.08); }
  .inputRow { display:flex; padding:12px; gap:8px; background:white; }
  .inputRow input { flex:1; padding:12px; border:1px solid #ddd; border-radius:20px; }
  .inputRow button { background:#ff5f8a; color:white; border:none; border-radius:20px; padding:0 20px; font-weight:bold; }
  .msg { text-align:center; color:#999; padding:20px; }
  .matchLink { display:block; background:white; margin:8px 16px; padding:14px; border-radius:14px; text-decoration:none; color:#333; font-weight:bold; box-shadow:0 2px 6px rgba(0,0,0,0.06); }
</style>
</head>
<body>
<div class="header">
  <span>Chat</span>
  <span class="coinBadge" id="coinBadge">-- coins</span>
</div>
<div class="messages" id="messages"><div class="msg" id="loadingMsg">Starting...</div></div>
<div class="inputRow" style="display:none;" id="inputRow">
  <input type="text" id="msgInput" placeholder="Type a message...">
  <button id="sendBtn">Send</button>
</div>

<script>
  var supabaseUrl = 'https://hqwqodmrnplswieprhms.supabase.co';
  var supabaseKey = 'sb_publishable_Wza9AqCngRXI-6GjMO6r2g_yNBJx6rY';
  var supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
  var messagesDiv = document.getElementById('messages');
  var inputRow = document.getElementById('inputRow');
  var msgInput = document.getElementById('msgInput');
  var sendBtn = document.getElementById('sendBtn');
  var coinBadge = document.getElementById('coinBadge');

  var currentUserId = null;
  var activeMatchId = null;

  function getMatchIdFromUrl() {
    var params = new URLSearchParams(window.location.search);
    return params.get('match');
  }

  function withTimeout(promise, ms, label) {
    var timeout = new Promise(function(_, reject) {
      setTimeout(function() { reject(new Error(label + ' timed out')); }, ms);
    });
    return Promise.race([promise, timeout]);
  }

  function setStatus(text) {
    messagesDiv.innerHTML = '<div class="msg">' + text + '</div>';
  }

  async function refreshCoinBadge() {
    var res = await withTimeout(
      supabaseClient.from('profiles').select('coins').eq('id', currentUserId).single(),
      8000, 'Coin balance lookup'
    );
    if (res.data) {
      coinBadge.textContent = res.data.coins + ' coins';
    }
  }

  async function init() {
    try {
      setStatus('Checking login...');
      var userRes = await withTimeout(supabaseClient.auth.getUser(), 8000, 'Login check');
      var user = userRes.data.user;
      if (!user) {
        setStatus('Please log in first.');
        return;
      }
      currentUserId = user.id;

      setStatus('Loading coin balance...');
      await refreshCoinBadge();

      var matchId = getMatchIdFromUrl();
      if (!matchId) {
        setStatus('Loading your matches...');
        var matchesRes = await withTimeout(
          supabaseClient.from('matches').select('*'),
          8000, 'Matches lookup'
        );

        if (!matchesRes.data || matchesRes.data.length === 0) {
          setStatus('No matches yet. Go like someone on Discover first!');
          return;
        }

        setStatus('Loading match names...');
        var otherIds = matchesRes.data.map(function(m) {
          return m.user1_id === currentUserId ? m.user2_id : m.user1_id;
        });

        var profilesRes = await withTimeout(
          supabaseClient.from('profiles').select('id, full_name').in('id', otherIds),
          8000, 'Match name lookup'
        );
        var nameMap = {};
        if (profilesRes.data) {
          profilesRes.data.forEach(function(p) { nameMap[p.id] = p.full_name || 'Someone'; });
        }

        messagesDiv.innerHTML = '';
        matchesRes.data.forEach(function(m) {
          var otherId = m.user1_id === currentUserId ? m.user2_id : m.user1_id;
          var link = document.createElement('a');
          link.className = 'matchLink';
          link.href = 'chat.html?match=' + m.id;
          link.textContent = nameMap[otherId] || 'Someone';
          messagesDiv.appendChild(link);
        });
        return;
      }

      activeMatchId = matchId;
      inputRow.style.display = 'flex';
      setStatus('Loading messages...');
      await loadMessages();

    } catch (err) {
      setStatus('Error: ' + err.message);
    }
  }

  async function loadMessages() {
    var res = await withTimeout(
      supabaseClient.from('messages').select('*').eq('match_id', activeMatchId).order('created_at', { ascending: true }),
      8000, 'Messages lookup'
    );
    messagesDiv.innerHTML = '';
    if (res.error) {
      messagesDiv.innerHTML = '<div class="msg">Error: ' + res.error.message + '</div>';
      return;
    }
    res.data.forEach(function(m) {
      var bubble = document.createElement('div');
      bubble.className = 'bubble ' + (m.sender_id === currentUserId ? 'mine' : 'theirs');
      bubble.textContent = m.content;
      messagesDiv.appendChild(bubble);
    });
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  sendBtn.addEventListener('click', async function() {
    var text = msgInput.value.trim();
    if (!text || !activeMatchId) return;
    msgInput.value = '';

    var result = await supabaseClient.rpc('send_paid_message', { p_match_id: activeMatchId, p_content: text });
    if (result.error) {
      alert('Message failed: ' + result.error.message);
      return;
    }

    await refreshCoinBadge();
    loadMessages();
  });

  msgInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendBtn.click();
  });

  init();
</script>
</body>
</html>
