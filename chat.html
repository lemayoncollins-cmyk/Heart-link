
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Link - Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { margin:0; font-family:-apple-system,sans-serif; background:#fff0f4; height:100vh; display:flex; flex-direction:column; }
  .header { background:#ff5f8a; color:white; padding:16px; text-align:center; font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
  .coinBadge { background:rgba(255,255,255,0.25); padding:4px 10px; border-radius:12px; font-size:13px; }
  .messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .bubble { max-width:75%; padding:10px 14px; border-radius:16px; font-size:14px; }
  .mine { align-self:flex-end; background:#ff5f8a; color:white; }
  .theirs { align-self:flex-start; background:white; color:#333; box-shadow:0 2px 6px rgba(0,0,0,0.08); }
  .inputRow { display:flex; padding:12px; gap:8px; background:white; }
  .inputRow input { flex:1; padding:12px; border:1px solid #ddd; border-radius:20px; }
  .inputRow button { background:#ff5f8a; color:white; border:none; border-radius:20px; padding:0 20px; font-weight:bold; }
  .msg { text-align:center; color:#999; padding:20px; }

  .incomingCallOverlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.85); display:none;
    align-items:center; justify-content:center; flex-direction:column;
    color:white; z-index:999; text-align:center; padding:20px;
  }
  .incomingCallOverlay .callTitle { font-size:20px; font-weight:bold; margin-bottom:24px; }
  .incomingCallOverlay .callButtons { display:flex; gap:16px; }
  .incomingCallOverlay button {
    padding:14px 28px; border:none; border-radius:24px; font-weight:bold; font-size:16px;
  }
  .joinCallBtn { background:#2ecc71; color:white; }
  .declineCallBtn { background:#e74c3c; color:white; }
</style>
</head>
<body>
<div class="header">
  <span>Chat</span>
  <span class="coinBadge" id="coinBadge">-- coins</span>
</div>
<div class="messages" id="messages"><div class="msg" id="loadingMsg">Loading conversation list...</div></div>
<div class="inputRow" style="display:none;" id="inputRow">
  <input type="text" id="msgInput" placeholder="Type a message...">
  <button id="sendBtn">Send</button>
</div>

<div class="incomingCallOverlay" id="incomingCallOverlay">
  <div class="callTitle" id="incomingCallText">Incoming call...</div>
  <div class="callButtons">
    <button class="joinCallBtn" id="joinCallBtn">Join</button>
    <button class="declineCallBtn" id="declineCallBtn">Decline</button>
  </div>
</div>

<script>
  var supabaseUrl = 'https://hqwqodmrnplswieprhms.supabase.co';
  var supabaseKey = 'sb_publishable_Wza9AqCngRXI-6GjMO6r2g_yNBJx6rY';
  var supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
  var messagesDiv = document.getElementById('messages');
  var inputRow = document.getElementById('inputRow');
  var msgInput = document.getElementById('msgInput');
  var sendBtn = document.getElementById('sendBtn');
  var coinBadge = document.getElementById('coinBadge');
  var incomingCallOverlay = document.getElementById('incomingCallOverlay');
  var incomingCallText = document.getElementById('incomingCallText');
  var joinCallBtn = document.getElementById('joinCallBtn');
  var declineCallBtn = document.getElementById('declineCallBtn');

  var currentUserId = null;
  var activeMatchId = null;
  var currentInvite = null;

  function getMatchIdFromUrl() {
    var params = new URLSearchParams(window.location.search);
    return params.get('match');
  }

  async function refreshCoinBadge() {
    var res = await supabaseClient.from('profiles').select('coins').eq('id', currentUserId).single();
    if (res.data) {
      coinBadge.textContent = res.data.coins + ' coins';
    }
  }

  function showIncomingCall(invite) {
    currentInvite = invite;
    incomingCallText.textContent = 'Incoming video call...';
    incomingCallOverlay.style.display = 'flex';
  }

  function hideIncomingCall() {
    incomingCallOverlay.style.display = 'none';
    currentInvite = null;
  }

  joinCallBtn.addEventListener('click', function() {
    if (currentInvite) {
      window.location.href = 'call.html?match=' + currentInvite.match_id;
    }
  });

  declineCallBtn.addEventListener('click', async function() {
    if (currentInvite) {
      await supabaseClient.from('call_invites').update({ status: 'declined' }).eq('id', currentInvite.id);
    }
    hideIncomingCall();
  });

  function listenForCalls() {
    supabaseClient
      .channel('call_invites_channel')
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'call_invites',
        filter: 'receiver_id=eq.' + currentUserId
      }, function(payload) {
        showIncomingCall(payload.new);
      })
      .subscribe();
  }

  async function init() {
    var userRes = await supabaseClient.auth.getUser();
    var user = userRes.data.user;
    if (!user) {
      messagesDiv.innerHTML = '<div class="msg">Please log in first.</div>';
      return;
    }
    currentUserId = user.id;

    await refreshCoinBadge();
    listenForCalls();

    var matchId = getMatchIdFromUrl();
    if (!matchId) {
      var matchesRes = await supabaseClient.from('matches').select('*');
      if (!matchesRes.data || matchesRes.data.length === 0) {
        messagesDiv.innerHTML = '<div class="msg">No matches yet. Go like someone on Discover first!</div>';
        return;
      }
      var links = matchesRes.data.map(function(m) {
        var otherId = m.user1_id === currentUserId ? m.user2_id : m.user1_id;
        return '<div class="msg"><a href="chat.html?match=' + m.id + '">Open chat with match ' + otherId.slice(0,8) + '</a></div>';
      }).join('');
      messagesDiv.innerHTML = links;
      return;
    }

    activeMatchId = matchId;
    inputRow.style.display = 'flex';
    loadMessages();
  }

  async function loadMessages() {
    messagesDiv.innerHTML = '';
    var res = await supabaseClient.from('messages').select('*').eq('match_id', activeMatchId).order('created_at', { ascending: true });
    if (res.error) {
      messagesDiv.innerHTML = '<div class="msg">Error: ' + res.error.message + '</div>';
      return;
    }
    res.data.forEach(function(m) {
      var bubble = document.createElement('div');
      bubble.className = 'bubble ' + (m.sender_id === currentUserId ? 'mine' : 'theirs');
      bubble.textContent = m.content;
      messagesDiv.appendChild(bubble);
    });
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  sendBtn.addEventListener('click', async function() {
    var text = msgInput.value.trim();
    if (!text || !activeMatchId) return;
    msgInput.value = '';

    var result = await supabaseClient.rpc('send_paid_message', { p_match_id: activeMatchId, p_content: text });
    if (result.error) {
      alert('Message failed: ' + result.error.message);
      return;
    }

    await refreshCoinBadge();
    loadMessages();
  });

  msgInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendBtn.click();
  });

  init();
</script>
</body>
</html>
