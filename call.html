<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Link - Call</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@daily-co/daily-js"></script>
<style>
  body { margin:0; font-family:-apple-system,sans-serif; background:#111; height:100vh; display:flex; flex-direction:column; }
  #callFrame { flex:1; border:none; width:100%; }
  .msg { color:white; text-align:center; padding:40px 20px; font-size:16px; }
  .startBtn { background:#ff5f8a; color:white; border:none; padding:14px 24px; border-radius:24px; font-weight:bold; font-size:16px; margin:20px auto; display:block; }
  .cancelBtn { background:#444; color:white; border:none; padding:10px 20px; border-radius:20px; font-size:14px; margin:10px auto; display:none; }
  .coinCounter {
    position:fixed; top:10px; right:10px; background:rgba(0,0,0,0.7); color:white;
    padding:8px 14px; border-radius:16px; font-size:13px; font-weight:bold; z-index:1000; display:none;
  }
</style>
</head>
<body>
<div id="landing">
  <div class="msg" id="msg">Loading...</div>
  <button class="startBtn" id="startBtn" style="display:none;">Start Call</button>
  <button class="cancelBtn" id="cancelBtn">Cancel</button>
</div>
<div class="coinCounter" id="coinCounter">-- coins</div>
<iframe id="callFrame" style="display:none;" allow="camera; microphone; fullscreen; speaker; display-capture"></iframe>

<script>
  var supabaseUrl = 'https://hqwqodmrnplswieprhms.supabase.co';
  var supabaseKey = 'sb_publishable_Wza9AqCngRXI-6GjMO6r2g_yNBJx6rY';
  var supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
  var msg = document.getElementById('msg');
  var startBtn = document.getElementById('startBtn');
  var cancelBtn = document.getElementById('cancelBtn');
  var callFrame = document.getElementById('callFrame');
  var landing = document.getElementById('landing');
  var coinCounter = document.getElementById('coinCounter');

  function getParam(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function withTimeout(promise, ms, label) {
    var timeout = new Promise(function(_, reject) {
      setTimeout(function() { reject(new Error(label + ' timed out')); }, ms);
    });
    return Promise.race([promise, timeout]);
  }

  function describeError(err) {
    if (!err) return 'Unknown error (no details given)';
    if (typeof err === 'string') return err;
    if (err.message) return err.message;
    if (err.errorMsg) return err.errorMsg;
    try { return JSON.stringify(err); } catch (e) { return 'Unknown error'; }
  }

  var matchId = getParam('match');
  var inviteId = getParam('invite');
  var callType = getParam('type') || 'video';
  var currentUserId = null;
  var ringChannel = null;
  var ringTimeoutHandle = null;
  var billingIntervalHandle = null;
  var activeCallFrameInstance = null;

  if (callType === 'voice') {
    startBtn.textContent = 'Start Voice Call';
  }

  async function refreshCoinCounter() {
    var res = await supabaseClient.from('profiles').select('coins').eq('id', currentUserId).single();
    if (res.data) {
      coinCounter.textContent = res.data.coins + ' coins';
    }
  }

  async function chargeMinuteAndCheck() {
    var result = await supabaseClient.rpc('charge_call_minute', {
      p_match_id: matchId,
      p_call_type: callType
    });

    if (result.error || result.data === false) {
      endCallDueToNoCoins();
      return;
    }

    await refreshCoinCounter();
  }

  function endCallDueToNoCoins() {
    if (billingIntervalHandle) clearInterval(billingIntervalHandle);
    if (activeCallFrameInstance) {
      try { activeCallFrameInstance.leave(); } catch (e) {}
    }
    landing.style.display = 'block';
    callFrame.style.display = 'none';
    coinCounter.style.display = 'none';
    msg.textContent = 'Call ended: out of coins.';
    startBtn.style.display = 'block';
  }

  async function joinRoom(roomUrl, type, isCaller) {
    msg.textContent = 'Joining call...';
    startBtn.style.display = 'none';
    cancelBtn.style.display = 'none';
    landing.style.display = 'none';
    callFrame.style.display = 'block';

    if (!window.DailyIframe) {
      throw new Error('Video call library failed to load. Check your internet connection and try again.');
    }

    var callFrameInstance = window.DailyIframe.wrap(callFrame, { showLeaveButton: true });
    activeCallFrameInstance = callFrameInstance;

    callFrameInstance.on('error', function(e) {
      console.log('Daily error event:', e);
    });

    callFrameInstance.on('left-meeting', function() {
      if (billingIntervalHandle) clearInterval(billingIntervalHandle);
      coinCounter.style.display = 'none';
    });

    await withTimeout(
      callFrameInstance.join({
        url: roomUrl,
        showFullscreenButton: true,
        prejoinUI: false,
        startVideoOff: type === 'voice'
      }),
      30000, 'Call join'
    );

    if (isCaller) {
      coinCounter.style.display = 'block';
      await chargeMinuteAndCheck();
      billingIntervalHandle = setInterval(chargeMinuteAndCheck, 60000);
    }
  }

  // RECEIVER FLOW: arrived via ?invite=<id> after tapping Join in chat.html
  async function receiverInit() {
    var res = await supabaseClient.from('call_invites').select('*').eq('id', inviteId).single();
    if (res.error || !res.data || !res.data.call_room_url) {
      msg.textContent = 'This call is no longer available.';
      return;
    }
    try {
      var userRes = await supabaseClient.auth.getUser();
      currentUserId = userRes.data.user ? userRes.data.user.id : null;
      await joinRoom(res.data.call_room_url, res.data.call_type || 'video', false);
    } catch (err) {
      console.log('Join error (receiver):', err);
      landing.style.display = 'block';
      callFrame.style.display = 'none';
      msg.textContent = 'Error: ' + describeError(err);
      startBtn.style.display = 'block';
    }
  }

  // CALLER FLOW: normal ?match=<id>&type=video|voice, tapping Start Call
  async function callerInit() {
    var userRes = await supabaseClient.auth.getUser();
    if (!userRes.data.user) {
      msg.textContent = 'Please log in first.';
      return;
    }
    currentUserId = userRes.data.user.id;

    if (!matchId) {
      msg.textContent = 'No match specified. Open this from your chat.';
      return;
    }
    msg.textContent = 'Ready to start your call.';
    startBtn.style.display = 'block';
  }

  startBtn.addEventListener('click', async function() {
    startBtn.style.display = 'none';

    try {
      msg.textContent = 'Looking up match...';
      var matchRes = await withTimeout(
        supabaseClient.from('matches').select('*').eq('id', matchId).single(),
        10000, 'Match lookup'
      );

      if (matchRes.error || !matchRes.data) {
        msg.textContent = 'Could not find this match.';
        startBtn.style.display = 'block';
        return;
      }

      var match = matchRes.data;
      var otherUserId = match.user1_id === currentUserId ? match.user2_id : match.user1_id;

      msg.textContent = 'Creating call room...';
      var res = await withTimeout(
        fetch('/.netlify/functions/create-call-room', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ matchId: matchId })
        }),
        10000, 'Room creation'
      );

      var data = await res.json();

      if (!res.ok || !data.url) {
        msg.textContent = 'Could not start the call: ' + (data.error || 'unknown error');
        startBtn.style.display = 'block';
        return;
      }

      var roomUrl = data.url;

      await supabaseClient
        .from('matches')
        .update({ call_room_url: roomUrl })
        .eq('id', matchId);

      var inviteRes = await supabaseClient.from('call_invites').insert({
        match_id: matchId,
        caller_id: currentUserId,
        receiver_id: otherUserId,
        call_room_url: roomUrl,
        call_type: callType,
        status: 'ringing'
      }).select().single();

      if (inviteRes.error || !inviteRes.data) {
        msg.textContent = 'Could not ring your match. Please try again.';
        startBtn.style.display = 'block';
        return;
      }

      var currentInviteId = inviteRes.data.id;
      msg.textContent = 'Calling... waiting for answer.';
      cancelBtn.style.display = 'block';

      ringChannel = supabaseClient
        .channel('ring_status_' + currentInviteId)
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'call_invites',
          filter: 'id=eq.' + currentInviteId
        }, function(payload) {
          handleInviteUpdate(payload.new, roomUrl);
        })
        .subscribe();

      ringTimeoutHandle = setTimeout(async function() {
        await supabaseClient.from('call_invites').update({ status: 'missed' }).eq('id', currentInviteId);
        cleanupRing();
        msg.textContent = 'No answer. They may be busy right now.';
        startBtn.style.display = 'block';
      }, 30000);

      cancelBtn.onclick = async function() {
        clearTimeout(ringTimeoutHandle);
        await supabaseClient.from('call_invites').update({ status: 'cancelled' }).eq('id', currentInviteId);
        cleanupRing();
        msg.textContent = 'Call cancelled.';
        cancelBtn.style.display = 'none';
        startBtn.style.display = 'block';
      };

    } catch (err) {
      console.log('Start call error:', err);
      msg.textContent = 'Error: ' + describeError(err);
      startBtn.style.display = 'block';
    }
  });

  function cleanupRing() {
    if (ringTimeoutHandle) clearTimeout(ringTimeoutHandle);
    if (ringChannel) supabaseClient.removeChannel(ringChannel);
  }

  function handleInviteUpdate(invite, roomUrl) {
    if (invite.status === 'accepted') {
      cleanupRing();
      cancelBtn.style.display = 'none';
      joinRoom(roomUrl, invite.call_type || 'video', true).catch(function(err) {
        console.log('Join error (caller):', err);
        landing.style.display = 'block';
        callFrame.style.display = 'none';
        msg.textContent = 'Error: ' + describeError(err);
        startBtn.style.display = 'block';
      });
    } else if (invite.status === 'declined') {
      cleanupRing();
      msg.textContent = 'Call declined.';
      cancelBtn.style.display = 'none';
      startBtn.style.display = 'block';
    }
  }

  if (inviteId) {
    receiverInit();
  } else {
    callerInit();
  }
</script>
</body>
</html>
