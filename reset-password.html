<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Link - Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { margin:0; font-family:-apple-system,sans-serif; background:linear-gradient(135deg,#ff5f8a,#ff8fab); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:white; border-radius:16px; padding:24px; width:100%; max-width:360px; box-shadow:0 10px 30px rgba(0,0,0,0.2); }
  h2 { color:#ff5f8a; text-align:center; margin-top:0; }
  input { width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
  button { width:100%; padding:12px; background:#ff5f8a; color:white; border:none; border-radius:8px; font-weight:bold; margin-top:8px; }
  .msg { text-align:center; margin-top:12px; color:#333; font-size:14px; }
</style>
</head>
<body>
<div class="card">
  <h2>Set a New Password</h2>
  <form id="resetForm">
    <input type="password" id="newPassword" placeholder="New password (min 6 characters)" required minlength="6">
    <button type="submit">Update Password</button>
  </form>
  <div class="msg" id="msg"></div>
</div>

<script>
  var supabaseUrl = 'https://hqwqodmrnplswieprhms.supabase.co';
  var supabaseKey = 'sb_publishable_Wza9AqCngRXI-6GjMO6r2g_yNBJx6rY';
  var supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
  var msg = document.getElementById('msg');
  var resetForm = document.getElementById('resetForm');

  resetForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    var newPassword = document.getElementById('newPassword').value;

    msg.textContent = 'Updating...';

    var result = await supabaseClient.auth.updateUser({ password: newPassword });

    if (result.error) {
      msg.textContent = result.error.message;
      return;
    }

    msg.textContent = 'Password updated! Redirecting to login...';
    setTimeout(function() {
      window.location.href = 'auth.html';
    }, 1500);
  });
</script>
</body>
</html>
