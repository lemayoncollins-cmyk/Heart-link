<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Link - Home</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { margin:0; font-family:-apple-system,sans-serif; background:#fff0f4; min-height:100vh; padding-bottom:30px; }
  .header { background:linear-gradient(135deg,#ff5f8a,#ff8fab); color:white; padding:24px 20px; }
  .profileRow { display:flex; align-items:center; gap:14px; }
  .profileRow img { width:60px; height:60px; border-radius:50%; object-fit:cover; background:rgba(255,255,255,0.3); border:2px solid white; }
  .profileRow .name { font-size:19px; font-weight:bold; }
  .profileRow .vipTag { font-size:12px; background:rgba(255,255,255,0.3); padding:2px 10px; border-radius:10px; display:inline-block; margin-top:4px; }
  .statsRow { display:flex; gap:10px; margin-top:18px; }
  .statCard { flex:1; background:rgba(255,255,255,0.2); border-radius:12px; padding:10px; text-align:center; }
  .statCard .val { font-size:18px; font-weight:bold; }
  .statCard .lbl { font-size:11px; opacity:0.9; }
  .tileGrid { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:20px; max-width:420px; margin:0 auto; }
  .tile { background:white; border-radius:16px; padding:18px 14px; text-align:center; text-decoration:none; box-shadow:0 4px 14px rgba(0,0,0,0.06); display:flex; flex-direction:column; align-items:center; gap:6px; }
  .tile .emoji { font-size:28px; }
  .tile .label { font-weight:bold; color:#333; font-size:14px; }
  .tile .sub { font-size:11px; color:#999; }
  .msg { text-align:center; color:#999; padding:20px; }
</style>
</head>
<body>
<div class="header">
  <div class="profileRow">
    <img id="profilePhoto" src="https://via.placeholder.com/60?text=%F0%9F%92%97">
    <div>
      <div class="name" id="profileName">Loading...</div>
      <div class="vipTag" id="vipTag" style="display:none;"></div>
    </div>
  </div>
  <div class="statsRow">
    <div class="statCard"><div class="val" id="coinStat">--</div><div class="lbl">Coins</div></div>
    <div class="statCard"><div class="val" id="matchStat">--</div><div class="lbl">Matches</div></div>
  </div>
</div>

<div class="tileGrid" id="tileGrid">
  <a class="tile" href="discover.html">
    <div class="emoji">💗</div>
    <div class="label">Discover</div>
    <div class="sub">Find someone new</div>
  </a>
  <a class="tile" href="community.html">
    <div class="emoji">🌐</div>
    <div class="label">Community</div>
    <div class="sub">Post & chat freely</div>
  </a>
  <a class="tile" href="chat.html">
    <div class="emoji">💬</div>
    <div class="label">Matches</div>
    <div class="sub" id="matchSub">Your conversations</div>
  </a>
  <a class="tile" href="buy-coins.html">
    <div class="emoji">🪙</div>
    <div class="label">Buy Coins</div>
    <div class="sub">Top up your balance</div>
  </a>
  <a class="tile" href="vip.html">
    <div class="emoji">💎</div>
    <div class="label">VIP</div>
    <div class="sub">Unlock perks</div>
  </a>
  <a class="tile" href="withdraw.html">
    <div class="emoji">💰</div>
    <div class="label">Earnings</div>
    <div class="sub">Withdraw coins</div>
  </a>
  <a class="tile" href="profile.html">
    <div class="emoji">👤</div>
    <div class="label">Profile</div>
    <div class="sub">Edit your info</div>
  </a>
</div>

<script>
  var supabaseUrl = 'https://hqwqodmrnplswieprhms.supabase.co';
  var supabaseKey = 'sb_publishable_Wza9AqCngRXI-6GjMO6r2g_yNBJx6rY';
  var supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

  var profilePhoto = document.getElementById('profilePhoto');
  var profileName = document.getElementById('profileName');
  var vipTag = document.getElementById('vipTag');
  var coinStat = document.getElementById('coinStat');
  var matchStat = document.getElementById('matchStat');

  function withTimeout(promise, ms, label) {
    var timeout = new Promise(function(_, reject) {
      setTimeout(function() { reject(new Error(label + ' timed out')); }, ms);
    });
    return Promise.race([promise, timeout]);
  }

  function listenForCoinChanges(userId) {
    try {
      supabaseClient
        .channel('coin_updates_' + userId)
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'profiles',
          filter: 'id=eq.' + userId
        }, function(payload) {
          if (payload.new.coins != null) {
            coinStat.textContent = payload.new.coins;
          }
        })
        .subscribe();
    } catch (err) {
      console.log('Realtime coin listener failed to start:', err.message);
    }
  }

  async function init() {
    try {
      var userRes = await withTimeout(supabaseClient.auth.getUser(), 8000, 'Login check');
      var user = userRes.data.user;
      if (!user) {
        document.body.innerHTML = '<div class="msg">Please log in first.</div>';
        return;
      }

      var profileRes = await withTimeout(
        supabaseClient.from('profiles').select('*').eq('id', user.id).single(),
        8000, 'Profile lookup'
      );

      if (profileRes.data) {
        var p = profileRes.data;
        profileName.textContent = p.full_name || 'Welcome';
        if (p.photo_url) profilePhoto.src = p.photo_url;
        coinStat.textContent = p.coins != null ? p.coins : 0;

        var isVip = p.vip_tier_id && p.vip_expires_at && new Date(p.vip_expires_at) > new Date();
        if (isVip) {
          var tierRes = await supabaseClient.from('vip_tiers').select('name').eq('id', p.vip_tier_id).single();
          vipTag.textContent = '⭐ ' + (tierRes.data ? tierRes.data.name : 'VIP');
          vipTag.style.display = 'inline-block';
        }
      }

      var matchesRes = await withTimeout(
        supabaseClient.from('matches').select('id'),
        8000, 'Matches lookup'
      );
      var matchCount = matchesRes.data ? matchesRes.data.length : 0;
      matchStat.textContent = matchCount;
      document.getElementById('matchSub').textContent = matchCount + ' conversation' + (matchCount === 1 ? '' : 's');

      listenForCoinChanges(user.id);

    } catch (err) {
      profileName.textContent = 'Error loading';
      console.log(err);
    }
  }

  init();
</script>
</body>
  </html>
