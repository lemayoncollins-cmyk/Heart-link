<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Link - Sign Up / Log In</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { margin:0; font-family:-apple-system,sans-serif; background:linear-gradient(135deg,#ff5f8a,#ff8fab); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:white; border-radius:16px; padding:24px; width:100%; max-width:360px; box-shadow:0 10px 30px rgba(0,0,0,0.2); }
  h2 { color:#ff5f8a; text-align:center; margin-top:0; }
  .tabs { display:flex; margin-bottom:16px; }
  .tab { flex:1; text-align:center; padding:10px; cursor:pointer; border:none; background:none; border-bottom:2px solid #eee; color:#999; font-size:16px; }
  .tab.active { border-bottom:2px solid #ff5f8a; color:#ff5f8a; font-weight:bold; }
  input { width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
  button[type="submit"] { width:100%; padding:12px; background:#ff5f8a; color:white; border:none; border-radius:8px; font-weight:bold; margin-top:8px; }
  .msg { text-align:center; margin-top:12px; color:#333; font-size:14px; }
  label.age { display:flex; align-items:center; font-size:13px; color:#555; margin-top:10px; }
  label.age input { width:auto; margin-right:8px; }
  #signupForm { display:none; }
</style>
</head>
<body>
<div class="card">
  <h2>💗 Heart Link</h2>
  <div class="tabs">
    <button type="button" class="tab active" id="loginTab" onclick="showTab('login')">Log In</button>
    <button type="button" class="tab" id="signupTab" onclick="alert('tapped'); showTab('signup')">Sign Up</button>
  </div>

  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit">Log In</button>
  </form>

  <form id="signupForm">
    <input type="email" id="signupEmail" placeholder="Email" required>
    <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" required minlength="6">
    <label class="age"><input type="checkbox" id="ageCheck" required> I confirm I am 18 years or older</label>
    <button type="submit">Sign Up</button>
  </form>

  <div class="msg" id="msg"></div>
</div>

<script>
  function showTab(tab) {
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
    document.getElementById('loginTab').classList.toggle('active', tab === 'login');
    document.getElementById('signupTab').classList.toggle('active', tab === 'signup');
  }

  let supabase;
  try {
    const supabaseUrl = "https://hqwqodmrnplswieprhms.supabase.co";
    const supabaseKey = "sb_publishable_Wza9AqCngRXI-6GjMO6r2g_yNBJx6rY";
    supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
  } catch (err) {
    document.getElementById('msg').textContent = "Setup error: " + err.message;
  }

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!supabase) { document.getElementById('msg').textContent = "Not connected yet - refresh the page."; return; }
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPassword').value;
    const { error } = await supabase.auth.signUp({ email, password });
    document.getElementById('msg').textContent = error ? error.message : "Account created! Check your email to confirm.";
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!supabase) { document.getElementById('msg').textContent = "Not connected yet - refresh the page."; return; }
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    document.getElementById('msg').textContent = error ? error.message : "Logged in! Welcome to Heart Link.";
  });
</script>
</body>
</html>
